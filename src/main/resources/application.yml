server:
  port: 8080

spring:
  application:
    name: youtube-dissertation-analyzer
  datasource:
    url: jdbc:h2:file:./data/dissertations;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

youtube:
  api:
    key: ${YOUTUBE_API_KEY:demo-key}
